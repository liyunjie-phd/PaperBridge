name: Build PaperBridge for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 is an older Intel label and can remain queued for a long
          # time. Use the currently supported standard Intel runner instead.
          - runner: macos-15-intel
            arch: x64
          - runner: macos-14
            arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add bundled Tectonic
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          # GitHub's macOS images may contain an unrelated untrusted tap.
          # PaperBridge only needs the official Tectonic formula.
          brew untap aws/tap >/dev/null 2>&1 || true
          brew install --formula tectonic
          tectonic --version
          mkdir -p "resources/bin/darwin-${{ matrix.arch }}"
          cp "$(brew --prefix tectonic)/bin/tectonic" "resources/bin/darwin-${{ matrix.arch }}/tectonic"
          chmod +x "resources/bin/darwin-${{ matrix.arch }}/tectonic"

      - name: Build DMG and ZIP
        run: npm run build:mac:${{ matrix.arch }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaperBridge-mac-${{ matrix.arch }}
          path: release/macos/*-mac-${{ matrix.arch }}.*
          if-no-files-found: error
