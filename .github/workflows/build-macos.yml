name: Build PaperBridge for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x64
          - runner: macos-14
            arch: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add bundled Tectonic
        shell: bash
        run: |
          brew install tectonic
          mkdir -p "resources/bin/darwin-${{ matrix.arch }}"
          cp "$(brew --prefix tectonic)/bin/tectonic" "resources/bin/darwin-${{ matrix.arch }}/tectonic"
          chmod +x "resources/bin/darwin-${{ matrix.arch }}/tectonic"

      - name: Build DMG and ZIP
        run: npm run build:mac:${{ matrix.arch }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaperBridge-mac-${{ matrix.arch }}
          path: release/macos/*-mac-${{ matrix.arch }}.*
          if-no-files-found: error
