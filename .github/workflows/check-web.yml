name: Check PaperBridge Web

on:
  workflow_dispatch:
  push:
    tags:
      - "web-v*"

permissions:
  contents: read

jobs:
  check:
    name: Web gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check product versions
        run: npm run versions:check

      - name: Verify Web release tag
        if: github.ref_type == 'tag'
        run: node scripts/product-version.mjs check-tag web "${{ github.ref_name }}"

      - name: Test web gateway
        run: npm test -- --test-name-pattern="web gateway|web user"
